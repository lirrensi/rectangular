<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rectangular</title>
<script src="/alpine.min.js" defer></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --text: #e6e8ee; --dim: #8b93a3; --accent: #8b5cf6; --green: #34d399; --amber: #fbbf24;
    --user: #8b5cf6; --agent: #22d3ee;
  }
  [data-theme="light"] {
    --bg: #f4f5f8; --panel: #ffffff; --panel2: #eceef2; --border: #d8dce4;
    --text: #1a1d24; --dim: #667085; --accent: #7c3aed; --green: #059669; --amber: #d97706;
    --user: #7c3aed; --agent: #0891b2;
  }
  /* RULE: this is RECTANGULAR. No curved corners. Ever. Angles only. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; min-height: 100vh; }
  header { display: flex; align-items: center; gap: 16px; padding: 16px 24px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 18px; font-weight: 700; }
  header .cwd { font-size: 12px; color: var(--dim); font-family: ui-monospace, monospace; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conn { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .conn .dot { width: 10px; height: 10px; background: var(--green); transition: background .3s; }
  .conn .dot.dead { background: #ef4444; }
  .conn .label { color: var(--dim); }
  .tabs { display: flex; gap: 6px; background: var(--panel); padding: 4px; }
  .tab { border: none; background: transparent; color: var(--dim); padding: 8px 16px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .tab.active { background: var(--panel2); color: var(--text); }
  .view-toggle { display: flex; gap: 4px; background: var(--panel); padding: 4px; }
  .view-toggle button { border: none; background: transparent; color: var(--dim); padding: 6px 10px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .view-toggle button.active { background: var(--panel2); color: var(--accent); }
  .search { display: flex; align-items: center; gap: 8px; }
  .search input { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; width: 220px; font-size: 13px; }
  .search input:focus { border-color: var(--accent); }
  .search .clear { background: transparent; border: none; color: var(--dim); cursor: pointer; font-size: 14px; padding: 4px; }
  .search .clear:hover { color: var(--text); }
  .new-ticket { display: flex; align-items: stretch; border: 1px solid var(--border); margin-bottom: 20px; transition: border-color .15s; }
  .new-ticket:focus-within { border-color: var(--accent); }
  .new-ticket input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); padding: 10px 12px; font: inherit; font-size: 14px; min-width: 0; }
  .new-ticket input::placeholder { color: var(--dim); font-style: italic; }
  .new-ticket button { background: var(--accent); border: none; color: var(--bg); padding: 0 16px; cursor: pointer; font-weight: 600; font-size: 18px; border-left: 1px solid var(--border); }
  .new-ticket button:hover { filter: brightness(1.1); }
  .settings { display: flex; align-items: center; gap: 12px; margin-left: auto; }
  .name-input { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; width: 120px; font-size: 12px; }
  .name-input:focus { border-color: var(--accent); }
  .theme-toggle { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; cursor: pointer; font-size: 13px; }
  .theme-toggle:hover { border-color: var(--accent); }
  .full-access { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); cursor: pointer; user-select: none; }
  .full-access .switch { width: 34px; height: 18px; background: var(--panel2); border: 1px solid var(--border); position: relative; transition: background .15s; }
  .full-access .switch.on { background: var(--amber); border-color: var(--amber); }
  .full-access .switch .knob { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; background: var(--text); transition: left .15s; }
  .full-access .switch.on .knob { left: 18px; }
  main { max-width: 860px; margin: 0 auto; padding: 24px; }
  .day { margin-bottom: 28px; }
  .day h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin-bottom: 10px; }
  .day.grid .day-body { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; align-items: stretch; }
  .ticket-card { background: var(--panel); border: 1px solid var(--border); padding: 12px; cursor: pointer; height: 120px; min-height: 120px; max-height: 120px; display: flex; flex-direction: column; gap: 6px; transition: border-color .15s, background .15s; overflow: hidden; }
  .ticket-card:hover { border-color: var(--accent); background: var(--panel2); }
  .ticket-card .card-top { display: flex; align-items: center; gap: 6px; }
  .ticket-card .card-title { font-weight: 600; font-size: 13px; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .ticket-card .card-status { font-size: 12px; color: var(--amber); margin-top: auto; }
  .ticket-card .card-state { font-size: 11px; color: var(--dim); }
  .ticket-card.expanded { grid-column: 1 / -1; height: auto; min-height: 0; max-height: 70vh; cursor: default; border-color: var(--accent); background: var(--panel2); padding: 16px; overflow-y: auto; }
  .ticket-card.expanded:hover { background: var(--panel2); }
  .card-expanded { display: flex; flex-direction: column; gap: 12px; }
  .card-expanded-head { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .card-expanded-title { flex: 1; font-weight: 600; font-size: 15px; min-width: 200px; word-break: break-word; }
  .card-close { background: transparent; border: 1px solid var(--border); color: var(--dim); padding: 6px 12px; cursor: pointer; font-size: 12px; font-weight: 600; margin-left: auto; }
  .card-close:hover { border-color: #ef4444; color: #ef4444; }
  .status-row { display: flex; align-items: stretch; border-top: 1px solid var(--border); transition: border-color .15s; }
  .status-row:hover { border-color: var(--dim); }
  .status-row:focus-within { border-color: var(--accent); }
  .status-row.has-value { border-color: var(--accent); }
  .status-row .label { display: flex; align-items: center; justify-content: center; width: 32px; background: var(--panel2); color: var(--accent); font-size: 12px; font-weight: 700; flex-shrink: 0; border-right: 1px solid var(--border); transition: background .15s, color .15s, border-color .15s; }
  .status-row:focus-within .label { background: var(--accent); color: var(--bg); border-right-color: var(--accent); }
  .status-row.has-value .label { background: var(--accent); color: var(--bg); border-right-color: var(--accent); }
  .status-row input { flex: 1; background: transparent; border: none; padding: 8px 12px; font-size: 13px; color: var(--text); outline: none; font-family: inherit; min-width: 0; }
  .status-row input::placeholder { color: var(--dim); font-style: italic; }
  .ticket { background: var(--panel); border: 1px solid var(--border); margin-bottom: 10px; overflow: hidden; }
  .ticket-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; }
  .ticket-head:hover { background: var(--panel2); }
  .id { color: var(--accent); font-weight: 700; font-size: 13px; min-width: 58px; }
  .claim { font-size: 13px; cursor: default; }
  .title { flex: 1; font-weight: 600; }
  .chat { border-top: 1px solid var(--border); padding: 12px 16px; }
  .msg { margin-bottom: 12px; }
  .msg .meta { font-size: 12px; color: var(--dim); margin-bottom: 3px; }
  .msg .meta .who { font-weight: 700; }
  .who.user { color: var(--user); } .who.assistant { color: var(--agent); } .who.system { color: var(--amber); }
  .msg .body { font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
  .msg .extra { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .reply { display: flex; gap: 8px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .reply input { flex: 1; background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; }
  .reply button { background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; cursor: pointer; font-weight: 600; }
  .reply .close { background: var(--amber); border-color: var(--amber); color: #3a2a00; }
  .reply .reopen { background: var(--green); border-color: var(--green); color: #00331f; }
  .review-dot { display: inline-block; width: 8px; height: 8px; background: var(--amber); margin-right: 4px; }
  .ticket-actions { display: flex; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); align-items: center; }
  .ticket-actions button { background: transparent; border: 1px solid var(--border); color: var(--dim); padding: 4px 10px; cursor: pointer; font-size: 12px; }
  .ticket-actions button:hover { border-color: var(--accent); color: var(--text); }
  .ticket-actions .danger:hover { border-color: #ef4444; color: #ef4444; }
  .ticket-actions input { flex: 1; background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 4px 10px; font-size: 12px; }
  .title-input { background: var(--panel2); border: 1px solid var(--accent); color: var(--text); padding: 2px 8px; font-size: inherit; width: 100%; min-width: 240px; resize: vertical; max-height: 120px; }
  .edit-confirm, .edit-cancel { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 2px 8px; cursor: pointer; font-size: 12px; }
  .edit-confirm:hover { border-color: var(--green); color: var(--green); }
  .edit-cancel:hover { border-color: #ef4444; color: #ef4444; }
  .empty { color: var(--dim); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div x-data="rectApp()" x-init="init()">
  <header>
    <h1>📐 Rectangular</h1>
    <span class="cwd" :title="cwd" x-text="cwd"></span>
    <span class="conn" :title="connected ? 'Server is alive — last ping ' + lastSeen : 'Server is not responding — last seen ' + lastSeen">
      <span class="dot" :class="connected ? '' : 'dead'"></span>
      <span class="label" x-text="connected ? 'connected' : 'offline'"></span>
    </span>
    <div class="tabs">
      <button class="tab" :class="{'active': tab === 'active'}" @click="switchTab('active')">
        Active <span x-text="counts.active"></span>
      </button>
      <button class="tab" :class="{'active': tab === 'review'}" @click="switchTab('review')">
        Review <span x-text="counts.review"></span>
      </button>
      <button class="tab" :class="{'active': tab === 'done'}" @click="switchTab('done')">
        Done <span x-text="counts.done"></span>
      </button>
    </div>
    <div class="view-toggle" title="View: sequential list or card grid">
      <button :class="{ 'active': view === 'list' }" @click="setView('list')">☰ List</button>
      <button :class="{ 'active': view === 'grid' }" @click="setView('grid')">▦ Grid</button>
    </div>
    <div class="search">
      <input x-model="query" @keydown.escape="query = ''" placeholder="Search titles & comments...">
      <button class="clear" x-show="query" @click="query = ''">✕</button>
    </div>
    <div class="settings">
      <input class="name-input" x-model="userName" @change="saveName()" placeholder="Your name"
             title="Name shown on your replies. Saved in this browser.">
      <div class="full-access" @click="toggleFullAccess()" title="Full Access Mode: lets agents delete/edit too">
        <div class="switch" :class="{ 'on': fullAccess }"><div class="knob"></div></div>
        Full Access
      </div>
      <button class="theme-toggle" @click="toggleTheme()" x-text="theme === 'dark' ? '☀️' : '🌙'"
              :title="theme === 'dark' ? 'Light mode' : 'Dark mode'"></button>
    </div>
  </header>

  <main>
    <div class="new-ticket">
      <input x-model="newTitle" @keydown.enter="addTicket()" placeholder="Type a task, press + ... voice dump welcome">
      <button @click="addTicket()">＋</button>
    </div>
    <template x-for="day in filteredDays" :key="day.day">
      <div class="day" :class="view === 'grid' ? 'grid' : 'list'">
        <h2 x-text="day.label"></h2>
        <div class="day-body">
        <template x-if="view === 'grid'">
          <template x-for="t in day.tickets" :key="t.id">
            <div class="ticket-card" :class="{ expanded: expandedCardId === t.id }"
                 @click="expandedCardId === t.id ? null : openFromCard(t)">
              <!-- compact view -->
              <div class="card-compact" x-show="expandedCardId !== t.id" :title="t.title">
                <div class="card-top">
                  <span class="id"><span class="review-dot" x-show="t.needs_review"></span><span x-text="t.no"></span></span>
                  <span class="claim" x-show="t.claimed_by" :title="'Claimed by ' + t.claimed_by" x-text="'🔒'"></span>
                </div>
                <div class="card-title" x-text="t.title"></div>
                <div class="card-status" x-show="t.status" x-text="t.status"></div>
                <div class="card-state" x-text="t.state === 'done' ? '✓ done' : (t.needs_review ? '👁 review' : '')"></div>
              </div>
              <!-- expanded view -->
              <div class="card-expanded" x-show="expandedCardId === t.id">
                <div class="card-expanded-head">
                  <span class="id">
                    <span class="review-dot" x-show="t.needs_review"></span>
                    <span x-text="t.no"></span>
                  </span>
                  <span class="claim" x-show="t.claimed_by" :title="'Claimed by ' + t.claimed_by" x-text="'🔒'"></span>
                  <span class="card-expanded-title" x-text="t.title"></span>
                  <button class="card-close" @click="closeCard()" title="Close (Esc)">✕ Close</button>
                </div>
                <div class="status-row" :class="{ 'has-value': t.status }" @click.stop>
                  <span class="label">S</span>
                  <input :placeholder="t.status ? '' : 'status...'"
                         :value="t.status"
                         @change="setStatus(t, $event.target.value)"
                         @keydown.enter="$event.target.blur()"
                         title="Status — free text for navigation. Edit anytime.">
                </div>
                <div class="chat">
                  <template x-for="c in t.messages || []" :key="c.id">
                    <div class="msg">
                      <div class="meta">
                        <span class="who" :class="c.role" x-text="c.role"></span>
                        <span x-show="c.name" x-text="'(' + c.name + ')'"></span>
                        <span x-text="c.created_at"></span>
                        <span class="extra" x-show="c.status_after" x-text="'→ status: ' + c.status_after"></span>
                        <span class="extra" x-show="c.action" x-text="'→ ' + c.action"></span>
                      </div>
                      <div class="body" x-text="c.body"></div>
                    </div>
                  </template>
                  <div class="reply">
                    <input x-model="replyText" @keydown.enter="reply(t)" placeholder="Write back ... (Enter = comment)">
                    <button @click="reply(t)">Comment</button>
                    <button class="close" @click="closeTicket(t)" x-show="t.state !== 'done'">Close</button>
                    <button class="reopen" @click="reopenTicket(t)" x-show="t.state === 'done'">Reopen</button>
                  </div>
                  <div class="ticket-actions">
                    <button class="danger" @click="deleteTicket(t)">🗑 Delete</button>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </template>
        <template x-if="view === 'list'">
        <template x-for="t in day.tickets" :key="t.id">
          <div class="ticket">
            <div class="ticket-head" @click="open(t)">
              <span class="id"><span class="review-dot" x-show="t.needs_review"></span><span x-text="t.no"></span></span>
              <span class="claim" x-show="t.claimed_by" :title="'Claimed by ' + t.claimed_by + ' (soft lock)'" x-text="'🔒'"></span>
              <span class="title" @dblclick.stop="startEditTitle(t)" x-show="editTicketId !== t.id" x-text="t.title"></span>
              <template x-if="editTicketId === t.id">
                <span class="title" style="flex: 2; display: flex; align-items: center; gap: 6px;">
                  <textarea class="title-input" x-model="editTitleVal" @keydown.enter.prevent="saveEdit(t)" @keydown.escape="cancelEdit()" @click.stop rows="2" style="min-height: 44px;"></textarea>
                  <button class="edit-confirm" @click.stop="saveEdit(t)">✓</button>
                  <button class="edit-cancel" @click.stop="cancelEdit()">✕</button>
                </span>
              </template>
            </div>
            <div class="status-row" :class="{ 'has-value': t.status }" @click.stop>
              <span class="label">S</span>
              <input :placeholder="t.status ? '' : 'status...'"
                     :value="t.status"
                     @change="setStatus(t, $event.target.value)"
                     @keydown.enter="$event.target.blur()"
                     title="Status — free text for navigation. Edit anytime.">
            </div>
            <div class="chat" x-show="openId === t.id">
              <template x-for="c in t.messages" :key="c.id">
                <div class="msg">
                  <div class="meta">
                    <span class="who" :class="c.role" x-text="c.role"></span>
                    <span x-show="c.name" x-text="'(' + c.name + ')'"></span>
                    <span x-text="c.created_at"></span>
                    <span class="extra" x-show="c.status_after" x-text="'→ status: ' + c.status_after"></span>
                    <span class="extra" x-show="c.action" x-text="'→ ' + c.action"></span>
                  </div>
                  <div class="body" x-text="c.body"></div>
                </div>
              </template>
              <div class="reply">
                <input x-model="replyText" @keydown.enter="reply(t)" placeholder="Write back ... (Enter = comment)">
                <button @click="reply(t)">Comment</button>
                <button class="close" @click="closeTicket(t)" x-show="t.state !== 'done'">Close</button>
                <button class="reopen" @click="reopenTicket(t)" x-show="t.state === 'done'">Reopen</button>
              </div>
              <div class="ticket-actions">
                <button class="danger" @click="deleteTicket(t)">🗑 Delete</button>
              </div>
            </div>
          </div>
        </template>
        </template>
        </div>
      </div>
    </template>
    <div class="empty" x-show="filteredDays.length === 0"
         x-text="tab === 'active' ? (query ? 'No matches. Search again, buttercup.' : 'No active tickets. Dump something above. 🎉') : (tab === 'review' ? (query ? 'No matches. Search again, buttercup.' : 'All caught up. Nothing needs your eyes. 💅') : (query ? 'No matches. Search again, buttercup.' : 'Nothing done yet. Go make me proud.'))"></div>
  </main>
</div>

<script>
function rectApp() {
  return {
    tab: 'active',
    days: [],
    counts: { active: 0, review: 0, done: 0 },
    cwd: '',
    openId: null,
    expandedCardId: null,
    newTitle: '',
    replyText: '',
    editTicketId: null,
    editTitleVal: '',
    fullAccess: false,
    query: '',
    userName: localStorage.getItem('rect_name') || '',
    theme: localStorage.getItem('rect_theme') || 'dark',
    view: localStorage.getItem('rect_view') || 'list',
    connected: true,
    lastSeen: 'never',
    _pingTimer: null,

    async init() {
      this.applyTheme();
      await this.loadSettings();
      await this.load();
      this.ping();
      this._pingTimer = setInterval(() => this.ping(), 3000);
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && this.expandedCardId) {
          this.closeCard();
        }
      });
    },

    setView(v) {
      this.view = v;
      if (v === 'list') this.expandedCardId = null;
      localStorage.setItem('rect_view', v);
    },

    async ping() {
      try {
        const r = await fetch('/api/status', { signal: AbortSignal.timeout(2500) });
        if (r.ok) {
          this.connected = true;
          this.lastSeen = new Date().toLocaleTimeString();
        } else {
          this.connected = false;
        }
      } catch {
        this.connected = false;
      }
      document.title = this.connected
        ? '📐 Rectangular — connected'
        : '📐 Rectangular — OFFLINE';
    },

    applyTheme() {
      document.documentElement.dataset.theme = this.theme;
    },

    toggleTheme() {
      this.theme = this.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('rect_theme', this.theme);
      this.applyTheme();
    },

    saveName() {
      localStorage.setItem('rect_name', this.userName);
    },

    get filteredDays() {
      const q = this.query.trim().toLowerCase();
      if (!q) return this.days;
      return this.days
        .map(day => {
          const tickets = day.tickets.filter(t => {
            const title = (t.title || '').toLowerCase();
            const comments = (t.messages || []).map(m => (m.body || '').toLowerCase()).join(' ');
            return title.includes(q) || comments.includes(q);
          });
          return tickets.length ? { ...day, tickets } : null;
        })
        .filter(Boolean);
    },

    async loadSettings() {
      const s = await (await fetch('/api/settings')).json();
      this.fullAccess = s.full_access;
    },

    async toggleFullAccess() {
      this.fullAccess = !this.fullAccess;
      await fetch('/api/settings/full_access', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ value: this.fullAccess })
      });
    },

    switchTab(t) { this.tab = t; this.openId = null; this.expandedCardId = null; this.load(); },

    async load() {
      const params = new URLSearchParams();
      if (this.tab === 'done') params.set('done', 'true');
      if (this.tab === 'review') params.set('review', 'true');
      const r = await fetch('/api/tickets?' + params.toString());
      this.days = await r.json();
      const s = await (await fetch('/api/status')).json();
      this.counts = { active: s.active_count, review: s.review_count, done: s.done_count };
      this.cwd = s.cwd || '';
    },

    async addTicket() {
      const title = this.newTitle.trim();
      if (!title) return;
      await fetch('/api/tickets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, created_by: 'user' })
      });
      this.newTitle = '';
      await this.load();
    },
    async open(t) {
      if (this.openId === t.id) { this.openId = null; return; }
      this.openId = t.id;
      if (!t.messages) {
        const r = await fetch('/api/tickets/' + t.no);
        const full = await r.json();
        t.messages = full.messages;
      }
    },

    async openFromCard(t) {
      // grid mode: expand the card in place. Don't drop into list view.
      if (this.expandedCardId === t.id) {
        this.closeCard();
        return;
      }
      this.expandedCardId = t.id;
      this.openId = t.id;
      if (!t.messages) {
        const r = await fetch('/api/tickets/' + t.no);
        const full = await r.json();
        t.messages = full.messages;
      }
    },

    closeCard() {
      this.expandedCardId = null;
      this.openId = null;
      this.replyText = '';
    },

    async reply(t) {
      const body = this.replyText.trim();
      if (!body) return;
      await fetch('/api/tickets/' + t.no + '/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ body, role: 'user', name: this.userName || null })
      });
      this.replyText = '';
      await this.load();
    },

    async closeTicket(t) {
      const body = this.replyText.trim();
      const payload = body ? { body, name: this.userName || null } : { name: this.userName || null };
      this.replyText = '';
      await fetch('/api/tickets/' + t.no + '/close', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      await this.load();
    },

    async reopenTicket(t) {
      const body = this.replyText.trim();
      const payload = body ? { body, name: this.userName || null } : { name: this.userName || null };
      this.replyText = '';
      await fetch('/api/tickets/' + t.no + '/reopen', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      await this.load();
    },

    startEditTitle(t) {
      this.editTicketId = t.id; this.editTitleVal = t.title;
    },
    cancelEdit() {
      this.editTicketId = null;
    },

    async setStatus(t, value) {
      const v = (value || '').trim();
      if (v === (t.status || '')) return;
      await fetch('/api/tickets/' + t.no + '/status', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: v })
      });
      await this.load();
    },

    async saveEdit(t) {
      const v = this.editTitleVal.trim();
      if (v && v !== t.title) {
        await fetch('/api/tickets/' + t.no, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: v, role: 'user' })
        });
      }
      this.cancelEdit();
      await this.load();
    },

    async deleteTicket(t) {
      if (!confirm('Delete ' + t.no + ' "' + t.title + '"?')) return;
      await fetch('/api/tickets/' + t.no, { method: 'DELETE' });
      this.openId = null;
      await this.load();
    }
  };
}
</script>
