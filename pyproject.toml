[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rectangular"
version = "0.1.0"
description = "Chat-first, UI-first task system. One folder, one SQLite DB, zero ceremony."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
rect = "rectangular.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rectangular"]

[tool.hatch.build.targets.wheel.force-include]
"src/rectangular/web/index.html" = "rectangular/web/index.html"
"src/rectangular/web/alpine.min.js" = "rectangular/web/alpine.min.js"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
