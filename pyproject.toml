[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rectangular"
version = "0.1.0"
description = "Chat-first, UI-first task system. One folder, one SQLite DB, zero ceremony."
readme = "SPEC.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
rect = "rectangular.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rectangular"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
